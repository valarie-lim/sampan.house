backend:
  name: github
  repo: valarie-lim/sampan.house
  branch: main
  # This base_url will point to your Vercel OAuth server, which we will set up in Stage 2
  base_url: https://sampan-house.vercel.app 
  auth_endpoint: api/auth

media_folder: "public/menu" # Where uploaded files/PDFs are saved in your repo
public_folder: "/menu"      # The public URL path to serve those files

collections:
  - name: "restaurant_menu"
    label: "Restaurant Menu Upload"
    folder: "public/menu"
    create: true
    extension: "pdf"
    format: "commit" # Tells Decap to just commit the raw file directly
    slug: "menu"     # Forces the file name to always be menu.pdf
    fields:
      - { label: "Upload New Menu PDF", name: "file", widget: "file" }
